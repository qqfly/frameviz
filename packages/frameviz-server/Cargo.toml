[package]
name = "frameviz-server"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "FrameViz WebSocket Server library for embedding in Tauri applications"

[lib]
name = "frameviz_server"
path = "src/lib.rs"

[[bin]]
name = "frameviz-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "macros", "time", "signal", "fs", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
url = "2.5"
once_cell = "1.19"
rand = "0.8"
libc = "0.2"
hyper = { version = "1.4", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
mime_guess = "2.0"
include_dir = "0.7"
