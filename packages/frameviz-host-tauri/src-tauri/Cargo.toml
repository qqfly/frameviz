[package]
name = "frameviz"
version = "0.4.0"
description = "FrameViz - Lightweight 3D Visualization Server"
authors = ["qqfly"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
once_cell = "1.19"
base64 = "0.21"
url = "2.5"
libc = "0.2"
rand = "0.8"  # P0: Secure random token generation
include_dir = "0.7"  # Embed static assets for HTTP server
frameviz-server = { path = "../../frameviz-server" }  # Shared server components

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
