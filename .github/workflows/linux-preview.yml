name: Ubuntu runtime preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-preview-${{ matrix.ubuntu }}-${{ hashFiles('packages/frameviz-host-tauri/src-tauri/Cargo.lock', 'packages/frameviz-server/Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install build
      - run: scripts/release/build-linux-preview.sh "$PWD/.cache/linux-preview"
      - name: Install desktop package and wheel in a clean container
        run: |
          docker run --rm -v "$PWD/.cache/linux-preview:/preview:ro" -v "$PWD/tests/acceptance/linux_installed_smoke.py:/smoke.py:ro" ubuntu:${{ matrix.ubuntu }} bash -euc '
            apt-get update
            apt-get install -y python3 python3-venv ca-certificates
            apt-get install -y /preview/*.deb
            test -x /usr/bin/frameviz
            test -x /usr/bin/frameviz-server
            useradd -m -d /tmp/frameviz-home smoke
            su -s /bin/bash smoke -c "python3 -m venv /tmp/frameviz-home/venv && /tmp/frameviz-home/venv/bin/pip install /preview/*.whl && /tmp/frameviz-home/venv/bin/python /smoke.py"
          '
      - name: Run standalone and wheel without desktop libraries
        run: |
          docker run --rm -v "$PWD/.cache/linux-preview:/preview:ro" -v "$PWD/tests/acceptance/linux_installed_smoke.py:/smoke.py:ro" ubuntu:${{ matrix.ubuntu }} bash -euc '
            apt-get update
            apt-get install -y python3 python3-venv ca-certificates
            useradd -m -d /tmp/frameviz-home smoke
            tar -xzf /preview/frameviz-server-linux-x86_64.tar.gz -C /tmp
            install -D -m 755 /tmp/frameviz-server/frameviz-server /tmp/frameviz-home/.local/bin/frameviz-server
            chown -R smoke:smoke /tmp/frameviz-home
            su -s /bin/bash smoke -c "python3 -m venv /tmp/frameviz-home/venv && /tmp/frameviz-home/venv/bin/pip install /preview/*.whl && /tmp/frameviz-home/venv/bin/python /smoke.py"
          '
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frameviz-ubuntu-${{ matrix.ubuntu }}-x86_64
          retention-days: 14
          if-no-files-found: error
          path: |
            .cache/linux-preview/*.deb
            .cache/linux-preview/*.tar.gz
            .cache/linux-preview/*.whl
            .cache/linux-preview/SHA256SUMS
            .cache/linux-preview/build.json
