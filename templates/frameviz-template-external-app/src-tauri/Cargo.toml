[package]
name = "frameviz-external-app"
version = "0.5.0"
description = "FrameViz External App Template (Tauri)"
authors = ["qqfly"]
edition = "2021"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
